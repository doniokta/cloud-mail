
name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# D1 Database
# Akan diaktifkan setelah database dibuat
# [[d1_databases]]
# binding = "db"
# database_name = "clashmate-mail-db"
# database_id = "ISI_DATABASE_ID"

# Workers KV
[[kv_namespaces]]
binding = "kv"
id = "ee9d8c3017874c639157fc1bbc8f8733"

# R2 Storage (opsional)
# [[r2_buckets]]
# binding = "r2"
# bucket_name = "clashmate-mail-storage"

# Cloudflare Email Sending
[[send_email]]
name = "forward"

# Workers AI
[ai]
binding = "ai"

# Static Assets
[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
# Konfigurasi aplikasi akan ditambahkan setelah database siap
# domain = ["clashmate.id"]
# admin = "admin@clashmate.id"
# jwt_secret = "GANTI_DENGAN_SECRET_ACAK_YANG_KUAT"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
